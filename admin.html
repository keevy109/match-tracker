<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSV Berghausen – Admin</title>
<script>
(function() {
  var s = localStorage.getItem('theme');
  if (s) document.documentElement.setAttribute('data-theme', s);
})();
</script>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────── -->
<header class="admin-header">
  <div class="admin-header-inner">
    <a class="admin-brand" href="index.html">
      <img src="/ssvlogo_white.png" alt="SSV Berghausen">
      <span class="admin-brand-name"><strong>SSV</strong> Admin</span>
    </a>
    <nav class="admin-tabs">
      <button class="admin-tab active" data-tab="kader">Kader</button>
      <button class="admin-tab" data-tab="spielplan">Spielplan</button>
      <button class="admin-tab" data-tab="vereine">Vereine</button>
      <button class="admin-tab" data-tab="news">Aktuelles</button>
    </nav>
    <a class="admin-back" href="index.html">← Website</a>
  </div>
</header>

<!-- ── Inhalt ─────────────────────────────────────────── -->
<main class="admin-main">

  <!-- KADER -->
  <section class="admin-section active" data-section="kader">
    <div class="section-header">
      <span class="section-title">Kader · Saison 2026/27</span>
      <button class="btn-add" onclick="openPlayerForm(null)">+ Spieler</button>
    </div>
    <div class="item-list" id="kaderList"></div>

    <div class="section-subheader">
      <span class="section-title" style="font-size:13px;opacity:0.7">Trainerteam</span>
      <button class="btn-add" onclick="openTrainerForm(null)">+ Trainer</button>
    </div>
    <div class="item-list" id="trainerList"></div>
  </section>

  <!-- VEREINE -->
  <section class="admin-section" data-section="vereine">
    <div class="section-header">
      <span class="section-title">Vereine · Gegner</span>
      <button class="btn-add" onclick="openClubForm(null)">+ Verein</button>
    </div>
    <div class="item-list" id="vereineList"></div>
  </section>

  <!-- SPIELPLAN -->
  <section class="admin-section" data-section="spielplan">
    <div class="section-header">
      <span class="section-title">Spielplan · Saison 2026/27</span>
      <button class="btn-add" onclick="openMatchForm(null)">+ Spiel</button>
    </div>
    <div class="item-list" id="spielplanList"></div>
  </section>

<section class="admin-section" data-section="news">
  <div class="section-header"><span class="section-title">Aktuelles</span><button class="btn-add" id="newNews">+ Beitrag</button></div>
  <p>Hier bearbeitest du Beiträge lokal. Veröffentlicht werden sie mit dem nächsten GitHub-Push.</p>
  <div class="item-list" id="newsAdminList"></div>
  <div id="newsEditorPanel" class="news-editor-panel" hidden>
    <div class="form-row"><label class="form-field">Titel<input class="form-input" id="newsTitle" maxlength="160" required></label><label class="form-field">Datum<input class="form-input" id="newsDate" type="date" required></label></div>
    <label class="form-field">Kurztext für die Übersicht<textarea class="form-input" id="newsExcerpt" rows="3" maxlength="500"></textarea></label>
    <label class="form-field">Titelbild<input id="newsImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
    <img id="newsImagePreview" alt="Titelbild-Vorschau" hidden><button class="btn-secondary" id="newsRemoveImage" type="button">Bild entfernen</button>
    <label class="news-publish"><input id="newsPublished" type="checkbox" checked> Auf der Website anzeigen (sonst Entwurf)</label>
    <label id="newsBodyLabel">Beitragstext</label>
    <div id="newsToolbar" class="news-toolbar" role="toolbar" aria-label="Text formatieren">
      <button type="button" data-command="bold" aria-label="Fett"><b>Fett</b></button><button type="button" data-command="italic" aria-label="Kursiv"><i>Kursiv</i></button><button type="button" data-command="underline">Unterstrichen</button>
      <button type="button" data-command="formatBlock" data-value="h2">Überschrift</button><button type="button" data-command="formatBlock" data-value="p">Absatz</button>
      <button type="button" data-command="insertUnorderedList">Aufzählung</button><button type="button" data-command="insertOrderedList">Nummerierung</button>
      <button type="button" data-command="createLink">Link</button><button type="button" data-command="unlink">Link entfernen</button><button type="button" data-command="removeFormat">Formatierung löschen</button>
      <button type="button" data-command="undo">Rückgängig</button><button type="button" data-command="redo">Wiederholen</button>
    </div>
    <div id="newsBody" class="news-richtext" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="newsBodyLabel" spellcheck="true"></div>
    <div class="news-editor-actions"><button class="btn-secondary" id="newsShowPreview" type="button">Vorschau</button><button class="btn-primary" id="newsSave" type="button">Lokal speichern</button></div>
    <p id="newsSaveStatus" role="status" aria-live="polite"></p>
    <label class="form-field">Fotos unterhalb des Textes<input id="newsPhotos" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="newsPhotosList"></div>
    <article id="newsPreview" hidden><img id="newsPreviewImage" alt="Titelbild" hidden><div id="newsPreviewDate"></div><h2 id="newsPreviewTitle"></h2><div id="newsPreviewBody" class="news-richtext"></div><div id="newsPreviewPhotos"></div></article>
  </div>
</section>

</main>

<!-- ── Formular-Panel ─────────────────────────────────── -->
<div class="form-overlay" id="formOverlay"></div>
<div class="form-panel" id="formPanel">
  <!-- wird per JS befüllt -->
</div>

<!-- ── Crop-Modal ───────────────────────────────────────────────── -->
<div class="crop-overlay" id="cropOverlay">
  <div class="crop-dialog">
    <div class="crop-header">Ausschnitt wählen</div>
    <div class="crop-wrap" id="cropWrap">
      <img id="cropSourceImg" src="" alt="" draggable="false">
      <div class="crop-box" id="cropBox">
        <div class="crop-handle crop-tl"></div>
        <div class="crop-handle crop-tr"></div>
        <div class="crop-handle crop-bl"></div>
        <div class="crop-handle crop-br"></div>
      </div>
    </div>
    <div class="crop-footer">
      <button class="btn-secondary" id="cropCancelBtn">Abbrechen</button>
      <button class="btn-primary"   id="cropConfirmBtn">Übernehmen</button>
    </div>
  </div>
</div>

<script type="module" src="/src/scripts/admin.js"></script>
</body>
</html>
